# Fuzzel launcher configuration
# Managed by dotfiles

[main]
font=JetBrainsMono Nerd Font:size=13
dpi-aware=auto
prompt="❯ "
icon-theme=Papirus-Dark
icons-enabled=yes
show-actions=yes
terminal=kitty -e
lines=10
width=40
horizontal-pad=20
vertical-pad=12
inner-pad=8
image-size-ratio=0.5

[colors]
background=1a1b26fa
text=c0caf5ff
match=7aa2f7ff
selection=283457ff
selection-text=c0caf5ff
selection-match=7aa2f7ff
border=7aa2f7ff

[border]
width=2
radius=10
