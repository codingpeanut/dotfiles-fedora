# Starship configuration (~/.config/starship.toml)
# Modern, fast prompt styling (Tokyo Night matching)

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$golang\
$cmd_duration\
$line_break\
$character"""

# Timeout for prompt commands
command_timeout = 1000

[character]
success_symbol = "[❯](bold #7aa2f7)"
error_symbol = "[❯](bold #f7768e)"

[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold #7dcfff"
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "bold #bb9af7"

[git_status]
style = "bold #f7768e"
format = '([$all_status$ahead_behind]($style) )'

[cmd_duration]
min_time = 2000
format = "took [$duration](#e0af68) "

[nodejs]
symbol = "󰎙 "
style = "bold #9ece6a"

[python]
symbol = "󰌠 "
style = "bold #e0af68"

[rust]
symbol = "󱘗 "
style = "bold #f7768e"

[golang]
symbol = "󰟓 "
style = "bold #7dcfff"
