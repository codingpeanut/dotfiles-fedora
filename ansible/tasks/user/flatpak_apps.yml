---
- name: Ensure user-level Flathub remote repository exists
  ansible.builtin.command:
    cmd: "flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo"
  register: flathub_user_remote
  changed_when: flathub_user_remote.rc == 0 and flathub_user_remote.stdout != ""
  failed_when: false

- name: Ensure user Flathub is unfiltered and enabled
  ansible.builtin.command:
    cmd: "flatpak remote-modify --user flathub --enable --no-filter"
  changed_when: false
  failed_when: false

- name: Update user Flathub appstream metadata
  ansible.builtin.command:
    cmd: "flatpak update --user --appstream"
  changed_when: false
  failed_when: false

- name: Get list of installed Flatpak applications
  ansible.builtin.command:
    cmd: "flatpak list --app --columns=application"
  register: installed_flatpaks
  changed_when: false
  failed_when: false

- name: Install declarative user Flatpak applications
  ansible.builtin.command:
    cmd: "flatpak install --user --noninteractive -y flathub {{ item }}"
  loop: "{{ (flatpak_user_packages | default([], true)) + (flatpak_user_packages_extra | default([], true)) }}"
  when: item not in (installed_flatpaks.stdout_lines | default([]))
  register: flatpak_install_result
  changed_when: flatpak_install_result.rc == 0
  failed_when: flatpak_install_result.rc != 0 and 'already installed' not in flatpak_install_result.stderr and '已安裝' not in flatpak_install_result.stderr
