---
# Configure third-party RPM repositories (VS Code, Google Chrome, RPM Fusion)

- name: Add Visual Studio Code RPM repository
  ansible.builtin.yum_repository:
    name: vscode
    description: Visual Studio Code
    baseurl: https://packages.microsoft.com/yumrepos/vscode
    enabled: true
    gpgcheck: true
    gpgkey: https://packages.microsoft.com/keys/microsoft.asc

- name: Ensure fedora-workstation-repositories is installed for Chrome
  ansible.builtin.dnf:
    name: fedora-workstation-repositories
    state: present

- name: Enable Google Chrome RPM repository
  ansible.builtin.command:
    cmd: dnf config-manager setopt google-chrome.enabled=1
  register: chrome_repo_result
  changed_when: "'google-chrome' in chrome_repo_result.stdout"
  failed_when: false

- name: Install RPM Fusion Free repository
  ansible.builtin.dnf:
    name: "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_distribution_major_version | default(ansible_facts['distribution_major_version'] | default('41')) }}.noarch.rpm"
    state: present
    disable_gpg_check: true
  register: rpmfusion_free_res
  failed_when: false

- name: Install RPM Fusion Non-Free repository
  ansible.builtin.dnf:
    name: "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_distribution_major_version | default(ansible_facts['distribution_major_version'] | default('41')) }}.noarch.rpm"
    state: present
    disable_gpg_check: true
  register: rpmfusion_nonfree_res
  failed_when: false

- name: Swap ffmpeg-free with full ffmpeg from RPM Fusion
  ansible.builtin.command:
    cmd: dnf swap -y ffmpeg-free ffmpeg --allowerasing
  register: ffmpeg_swap_result
  changed_when: "'Upgraded' in ffmpeg_swap_result.stdout or 'Installed' in ffmpeg_swap_result.stdout or 'Removed' in ffmpeg_swap_result.stdout"
  failed_when: false
